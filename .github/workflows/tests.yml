name: CPU code quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        python: ['3.10', '3.11']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip==24.3.1
      - run: python -m pip install torch==2.5.1 --no-deps --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements/dev.lock.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pip check
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m mypy
      - run: python -m pytest tests -q --junitxml=reports/tests.xml
      - run: python scripts/smoke_test.py --output-dir reports/ci_smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-evidence-${{ matrix.python }}
          path: |
            reports/tests.xml
            reports/ci_smoke/smoke_report.json
