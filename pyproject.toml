[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "defectfirst"
version = "0.1.0"
description = "Audited editing controls and independent-image defect segmentation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3", "Pillow>=10,<13", "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2", "PyYAML>=6,<7", "torch>=2.5,<3",
  "filelock>=3.13,<4", "huggingface-hub>=0.34,<1",
]

[project.optional-dependencies]
generation = ["diffusers==0.35.1", "transformers==4.56.2", "accelerate==1.10.1", "sentencepiece>=0.2,<0.3", "protobuf>=4,<7"]
dev = ["pytest>=8,<9", "ruff>=0.12,<1", "mypy>=2.3,<3", "types-PyYAML", "build"]

[project.scripts]
defectfirst = "defectfirst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["gpu: requires a CUDA GPU and locked pretrained assets"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src/defectfirst/config.py", "src/defectfirst/io.py", "src/defectfirst/data/schema.py", "src/defectfirst/training/schedule.py"]
