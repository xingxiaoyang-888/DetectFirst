max_workers: 2
assets:
  - id: dinov2_source
    kind: git
    url: https://github.com/facebookresearch/dinov2.git
    revision: 7764ea0f912e53c92e82eb78a2a1631e92725fc8
    path: third_party/dinov2
  - id: dinov2_weights
    kind: http
    url: https://dl.fbaipublicfiles.com/dinov2/dinov2_vitb14/dinov2_vitb14_pretrain.pth
    path: models_cache/dinov2_vitb14_pretrain.pth
  - id: flux_fill
    kind: huggingface
    repo_id: black-forest-labs/FLUX.1-Fill-dev
    revision: 358293da0354175698b67ec8299acf928313a78a
    path: models_cache/FLUX.1-Fill-dev
    allow_patterns:
      - model_index.json
      - scheduler/*
      - text_encoder/*
      - text_encoder_2/*
      - tokenizer/*
      - tokenizer_2/*
      - transformer/*
      - vae/*
  - id: visa
    kind: http
    url: https://amazon-visual-anomaly.s3.us-west-2.amazonaws.com/VisA_20220922.tar
    path: data/archives/VisA_20220922.tar
  - id: visa_fewshot_split
    kind: http
    url: https://raw.githubusercontent.com/amazon-science/spot-diff/2a692ab575001cbde74d402d897a7286086c6199/split_csv/2cls_fewshot.csv
    path: data/raw/visa_2cls_fewshot.csv
  - id: mvtec
    kind: manual
    url: https://www.mvtec.com/research-teaching/datasets/mvtec-ad
    path: data/raw/mvtec
  - id: ksdd2
    kind: manual
    url: https://www.vicos.si/resources/kolektorsdd2/
    path: data/raw/ksdd2
